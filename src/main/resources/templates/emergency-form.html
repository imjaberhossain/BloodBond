<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New emergency request · BloodBond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="font-body pb-24">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-2xl mx-auto px-4 pt-32">
    <div class="glass rounded-3xl shadow-glass p-8">
        <h1 class="text-2xl font-display font-bold text-white">🚨 Post an emergency request</h1>
        <p class="text-sm text-slate-400 mt-1">Be precise — donors near the location will see the exact distance.</p>

        <form th:action="@{/emergency/new}" method="post" class="mt-7 space-y-5">
            <div>
                <label class="text-sm text-slate-300 block mb-1.5">Patient name</label>
                <input type="text" name="patientName" required class="input-dark" placeholder="e.g. Mrs. Fatema Begum">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm text-slate-300 block mb-1.5">Blood group needed</label>
                    <select name="bloodGroup" required class="input-dark">
                        <option value="">Select…</option>
                        <option th:each="g : ${ {'A+','A−','B+','B−','O+','O−','AB+','AB−'} }" th:value="${g}" th:text="${g}"></option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-slate-300 block mb-1.5">Units needed</label>
                    <input type="number" name="unitsNeeded" min="1" max="20" value="1" required class="input-dark">
                </div>
            </div>
            <div>
                <label class="text-sm text-slate-300 block mb-1.5">Hospital / clinic name</label>
                <input type="text" name="hospitalName" required class="input-dark" placeholder="e.g. Dhaka Medical College Hospital">
            </div>
            <div>
                <label class="text-sm text-slate-300 block mb-1.5">Full address</label>
                <textarea name="address" rows="2" required class="input-dark resize-none" placeholder="Street, area, city"></textarea>
            </div>
            <div class="glass rounded-2xl p-4 border border-rose-500/30">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <p class="text-white font-semibold text-sm">📍 Incident location</p>
                    <button type="button" onclick="useMyLocation()" id="gps-btn" class="btn-primary text-sm">📡 Use my current location</button>
                </div>
                <input type="hidden" id="lat-input" name="latitude">
                <input type="hidden" id="lng-input" name="longitude">
                <p id="gps-status" class="text-xs text-slate-500 mt-2">Location is optional — add it so donors get directions.</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm text-slate-300 block mb-1.5">Contact phone</label>
                    <input type="text" name="contactPhone" required class="input-dark" placeholder="01XXXXXXXXX">
                </div>
                <div>
                    <label class="text-sm text-slate-300 block mb-1.5">Valid for</label>
                    <select name="validForHours" class="input-dark">
                        <option value="6">6 hours</option>
                        <option value="12">12 hours</option>
                        <option value="24" selected>24 hours</option>
                        <option value="48">48 hours</option>
                        <option value="72">72 hours</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-sm text-slate-300 block mb-1.5">Additional note (optional)</label>
                <textarea name="note" rows="2" class="input-dark resize-none" placeholder="Surgery time, doctor contact, etc."></textarea>
            </div>
            <button type="submit" class="btn-primary w-full justify-center py-3">Publish request 🚨</button>
        </form>
    </div>
</main>
<script>
function useMyLocation() {
    const status = document.getElementById('gps-status');
    if (!navigator.geolocation) { status.textContent = '⚠️ Geolocation is not supported by this browser.'; return; }
    document.getElementById('gps-btn').disabled = true;
    status.textContent = '⏳ Detecting your location…';
    navigator.geolocation.getCurrentPosition(
        pos => {
            document.getElementById('lat-input').value = pos.coords.latitude.toFixed(6);
            document.getElementById('lng-input').value = pos.coords.longitude.toFixed(6);
            status.textContent = '✅ Location captured — donors will get a directions link.';
            document.getElementById('gps-btn').disabled = false;
        },
        err => { status.textContent = '⚠️ ' + err.message; document.getElementById('gps-btn').disabled = false; },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
}
</script>
</body>
</html>
