<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-6xl">
    <div class="glass rounded-2xl px-5 py-3 flex items-center justify-between shadow-glass">
        <a th:href="@{/}" class="flex items-center gap-2 font-display text-xl font-bold text-white">
            <span class="text-2xl">🩸</span> Blood<span class="text-rose-400">Bond</span>
        </a>
        <div class="hidden md:flex items-center gap-6 text-sm font-medium">
            <a sec:authorize="!isAuthenticated()" th:href="@{/}" class="nav-link">Home</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/home}" class="nav-link">Feed</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/emergency}" class="nav-link">Emergency Board</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/search}" class="nav-link">Find Donors</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/chat}" class="nav-link">Messages</a>
            <a sec:authorize="isAuthenticated()" th:if="${currentUser != null}"
               th:href="@{/users/{id}(id=${currentUser.id})}" class="nav-link">My Profile</a>
        </div>
        <div class="flex items-center gap-3">
            <div sec:authorize="!isAuthenticated()" class="flex items-center gap-2">
                <a th:href="@{/auth/login}" class="btn-ghost">Log in</a>
                <a th:href="@{/auth/signup}" class="btn-primary">Join now</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="flex items-center gap-2">
                <a th:href="@{/chat}" class="icon-btn" title="Messages">💬</a>
                <a th:if="${currentUser != null}" th:href="@{/users/{id}(id=${currentUser.id})}"
                   class="avatar-circle" style="width:2.4rem;height:2.4rem;" title="My Profile">
                    <img th:if="${currentUser.avatarPath != null}" th:src="${currentUser.avatarPath}" alt="">
                    <span th:unless="${currentUser.avatarPath != null}"
                          th:text="${#strings.substring(currentUser.fullName,0,1)}"></span>
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-ghost">Log out</button>
                </form>
            </div>
            <button onclick="toggleMenu()" class="md:hidden icon-btn" type="button">☰</button>
        </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden mt-2 glass rounded-2xl p-4 flex flex-col gap-3 text-sm">
        <a sec:authorize="!isAuthenticated()" th:href="@{/}" class="nav-link">Home</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/home}" class="nav-link">Feed</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/emergency}" class="nav-link">Emergency Board</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/search}" class="nav-link">Find Donors</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/chat}" class="nav-link">Messages</a>
        <a sec:authorize="isAuthenticated()" th:if="${currentUser != null}"
           th:href="@{/users/{id}(id=${currentUser.id})}" class="nav-link">My Profile</a>
    </div>
</nav>
</body>
</html>
