<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password · BloodBond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="font-body flex items-center justify-center min-h-screen px-4">
<div class="blob w-[400px] h-[400px] bg-rose-600 top-0 left-0"></div>
<div class="blob w-[350px] h-[350px] bg-indigo-600 bottom-0 right-0"></div>

<div class="glass rounded-3xl shadow-glass p-10 w-full max-w-md relative">
    <a th:href="@{/}" class="font-display text-2xl font-bold text-white flex items-center gap-2 justify-center">
        <span>🩸</span> Blood<span class="text-rose-400">Bond</span>
    </a>
    <div class="text-5xl text-center mt-6">🔑</div>
    <h1 class="text-center text-white font-display font-bold text-xl mt-3">Forgot your password?</h1>
    <p class="text-center text-slate-400 text-sm mt-1">Enter your email — we will send a 6-digit reset code.</p>

    <div th:if="${error}" class="alert-err mt-6" th:text="${error}"></div>
    <div th:if="${message}" class="alert-ok mt-6" th:text="${message}"></div>

    <form th:action="@{/auth/forgot}" method="post" class="mt-8 space-y-5">
        <div>
            <label class="text-sm text-slate-300 block mb-1.5">Email</label>
            <input type="email" name="email" required class="input-dark" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-3 text-base">Send reset code</button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
        Remembered it? <a th:href="@{/auth/login}" class="text-rose-300 font-semibold hover:underline">Back to login</a>
    </p>
</div>
</body>
</html>
