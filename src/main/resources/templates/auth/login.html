<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · BloodBond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="font-body flex items-center justify-center min-h-screen px-4">
<div class="blob w-[400px] h-[400px] bg-rose-600 top-0 left-0"></div>
<div class="blob w-[350px] h-[350px] bg-indigo-600 bottom-0 right-0"></div>

<div class="glass rounded-3xl shadow-glass p-10 w-full max-w-md relative">
    <a th:href="@{/}" class="font-display text-2xl font-bold text-white flex items-center gap-2 justify-center">
        <span>🩸</span> Blood<span class="text-rose-400">Bond</span>
    </a>
    <h1 class="text-center text-white font-display font-bold text-xl mt-6">Welcome back, hero</h1>
    <p class="text-center text-slate-400 text-sm mt-1">Log in to your account</p>

    <div th:if="${param.error}" class="alert-err mt-6">Invalid email or password — or your email is not verified yet.</div>
    <div th:if="${message}" class="alert-ok mt-6 auto-dismiss" th:text="${message}"></div>

    <form th:action="@{/auth/login}" method="post" class="mt-8 space-y-5">
        <div>
            <label class="text-sm text-slate-300 block mb-1.5">Email</label>
            <input type="email" name="email" required class="input-dark" placeholder="you@example.com">
        </div>
        <div>
            <div class="flex justify-between items-center mb-1.5">
                <label class="text-sm text-slate-300">Password</label>
                <a th:href="@{/auth/forgot}" class="text-xs text-rose-300 hover:underline">Forgot password?</a>
            </div>
            <input type="password" name="password" required class="input-dark" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-3 text-base">Log in</button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
        New here? <a th:href="@{/auth/signup}" class="text-rose-300 font-semibold hover:underline">Create an account</a>
    </p>
</div>
</body>
</html>
