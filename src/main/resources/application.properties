spring.application.name=bloodbond
server.port=8080

# ---------- PostgreSQL (CHANGE USERNAME/PASSWORD IF NEEDED) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/bloodbond
spring.datasource.username=postgres
spring.datasource.password=Your Postegress Password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload (profile photos & post images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# Thymeleaf
spring.thymeleaf.cache=false
